"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Bosco Domingo"
email = "boscodomingob@gmail.com"

[signing]
behavior = "keep"
backend = "ssh"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBJ9uF4A1FF454eFAWhQab6uOuhtl6PVrvAez3AWuFLN Bosco Domingo"
backends.ssh.allowed-signers = "~/.ssh/allowed_signers"
backends.ssh.program = "ssh-sign"

[diff]
tool = "delta"

[ui]
bookmark-list-sort-keys = ["committer-date"]
conflict-marker-style = "snapshot"
default-command = ["log", "--no-pager", "-n=5"]
diff-editor = ":builtin"
diff-formatter = ":git" # required by `delta`
editor = "nvim"
graph.style = "curved"
wrapping = "word"
log-word-wrap = true
movement.edit = true # Useful if using `prev` and `next` and want to edit the parent directly
pager=["delta", "--side-by-side", "--pager", "less -FRX"] # Keeps output from the terminal after closing the pager
paginate="auto"
show-cryptographic-signatures = true

[ui.streampager]
interface = "quit-if-one-page"

[git]
# push-bookmark-prefix = "feat/"
sign-on-push = true # Lazy signing only on pushes

[templates]
git_push_bookmark = '"feat/" ++ change_id.short()'

[template-aliases]
'format_short_signature(signature)' = 'signature' # Name and email

# These options allow for `jj diff` and `jj show` to clear the output from the terminal after closing the pager.
[[--scope]]
--when.commands = ["diff", "show"]

[--scope.ui]
pager = ["delta", "--side-by-side"]

[remotes.origin]
auto-track-bookmarks = "*"

[aliases]
# Current state
st = ["status"]
sh = ["show"]
d = ["diff"]
l = ["log"]
la = ["log", "-r", "::"]
le = ["log", "-r", "empty() & mutable()"]
ln = ["log", "-r", "remote_bookmarks().."] # All non-pushed-yet commits
lnp = ["log", "-r", "(remote_bookmarks()..@)::"] # Current working copy's non-pushed-yet commits

# Commit
c = ["commit"]
ci = ["commit", "--interactive"]

# Edit commits
s = ["squash"]
si = ["squash", "--interactive"] # Edit a previous commit (empty for parent)
sii = ["squash", "--interactive", "--ignore-immutable"] # Force edit a previous commit (empty for parent)
er = ["squash", "-i", "-u", "-t"] # Edit target revision with current changes
de = ["diffedit"] # Alternative to squash

u = ["undo"]

a = ["absorb"]
aa = ["absorb", "--ignore-immutable", "-t", "immutable()"] # absorb disregarding immutability (such as bookmarked changes)

# Navigation
m = ["rebase", "-r", "@", "-d"] # move current revision only to the chosen destination
md = ["rebase", "-r", "@", "-d", "develop"]
mm = ["rebase", "-r", "@", "-d", "main"]

n = ["next"]
p = ["prev"]
e = ["edit"]
top = ["edit", "-r", "heads(@::)"]

# Rebase
r = ["rebase"]
rb = ["rebase", "--branch"]
ri = ["rebase", "--interactive"]

# Restore
rst = ["restore"]
rsti = ["restore", "--interactive"]

# Abandon
an = ["abandon"]
ane = ["abandon", "-r", "empty() & mutable()"]

# Resolve
slv = ["resolve"]
oplog = ["op", "log"]

# Branches/bookmarks
b = ["bookmark"]
bc = ["bookmark", "create"]
bcp = ["bookmark", "create", "-r", "@-"] # Create bookmark at parent
bs = ["bookmark", "set"] # Set bookmark. E.g. `jbsp main -r @-` to update tracked main to the latest commit
bsp = ["bookmark", "set", "-r", "@-"]
bsm = ["bookmark", "set", "main"] # Set main to the latest commit
bsmp = ["bookmark", "set", "main", "-r", "@-"]
bsd = ["bookmark", "set", "develop"] # Set develop to the latest commit
bsdp = ["bookmark", "set", "develop", "-r", "@-"]

# Git
g = ["git"]
gf = ["git", "fetch"]
gp = ["git", "push"]
gpb = ["git", "push", "-b"]
gpn = ["git", "push", "-N"] # Push only bookmarked changes
gpt = ["git", "push", "--tracked"] # Pushes all tracked branches
gpm = ["git", "push", "-b", "main"] # Push bookmarked changes to main
gpd = ["git", "push", "-b", "develop"] # Push bookmarked changes to develop
