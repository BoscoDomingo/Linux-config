[tools]
usage = "latest"  # Internal
bun = "latest"
go = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
rust = "latest"

biome = "latest"
golangci-lint = "latest"

[settings]
idiomatic_version_file_enable_tools = ["go"]

[tool_alias]
engram = "github:Gentleman-Programming/engram"
