[tools]
usage = "latest"  # Internal
bun = "latest"
go = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
rust = "latest"

act = "latest"
biome = "latest"
diffnav = "latest"
dotenvx = "latest"
gdu = "latest"
golangci-lint = "latest"
jj = "latest"
navi = "latest"
neovim = "latest"
opencode = "latest"
pi = "latest"
# ripgrep and hyperfine moved to Nix (nix/home/packages.nix) — the stable
# global toolbox has a single owner. mise keeps runtimes + floating dev tools.
# "tldr++" = "latest"
tlrc = "latest"
yt-dlp = "latest"
tree-sitter = "latest"
herdr = "latest"
engram = "latest"

[settings]
idiomatic_version_file_enable_tools = ["go"]

[tool_alias]
diffnav = "github:dlvhdr/diffnav"
go-blueprint = "github:Melkeydev/go-blueprint"
oh-my-posh = "github:JanDeDobbeleer/oh-my-posh"
"tldr++" = "github:isacikgoz/tldr"
tlrc = "cargo:tlrc"
engram = "github:Gentleman-Programming/engram"
