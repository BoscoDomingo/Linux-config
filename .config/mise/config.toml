# Synced mise baseline (language runtimes + floating tools).
# Per-machine extras: overrides/mise/config.toml (gitignored), exposed as
# ~/.mise/config.toml. See Documentation/machine-overrides.md.
[tools]
usage = "latest"  # Internal
bun = "latest"
go = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
rust = "latest"

biome = "latest"
golangci-lint = "latest"
diffnav = "0.11.0"
"tldr++" = "latest"
hunk = "latest"
"github:trasta298/keifu" = "latest"
shfmt = "latest"

[settings]
idiomatic_version_file_enable_tools = ["rust", "node", "bun", "deno", "golangci-lint", "python", "dotnet", "zig"]
auto_update = true
auto_update_check_duration = "2d"
github.credential_command = "gh auth token"
npm.bun = true
npm.package_manager = "auto"
pipx.uvx = true
safe = true
sandbox.deny_all = true
status = { show_deps_stale = true, show_env = true, missing_tools = "if_other_versions_installed", show_tools = true }
upgrade.auto_prune = true
upgrade.prune_after = "24h"


[tool_alias]
engram = "github:Gentleman-Programming/engram"
oh-my-posh = "github:JanDeDobbeleer/oh-my-posh"
"tldr++" = "github:isacikgoz/tldr"
diffnav = "aqua:dlvhdr/diffnav"
