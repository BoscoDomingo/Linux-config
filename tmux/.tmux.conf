
# 1-based index for windows
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 10000

set-option -g default-terminal "screen-256color"

# #
# Tmux Plugins Manager (TPM)
# #
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @prefix_highlight_fg 'black' # default is 'colour231'
# set -g @prefix_highlight_bg '#EEFF00'  # default is 'colour04'

# set -g @plugin 'erikw/tmux-powerline'

set -g @plugin 'wfxr/tmux-power'
# set -g @tmux_power_theme 'default'
set -g @tmux_power_theme '#aaff00'
set -g @tmux_power_right_arrow_icon     ''
set -g @tmux_power_left_arrow_icon      ''
# set -g @tmux_power_date_icon ' '
# set -g @tmux_power_time_icon ' '
# set -g @tmux_power_user_icon ' '
# set -g @tmux_power_session_icon ' '
set -g @tmux_power_prefix_highlight_pos 'LR'

# set -g @plugin 'jimeh/tmux-themepack'
# set -g @themepack 'powerline/double/cyan'

set-option -g status-bg black
set-option -g status-fg white
# set -g status-bg default
# set -g status-fg white

set -g status-interval 1
set -g status-right-length 100
set -g status-right '#(cat ~/.tmux-status)#{prefix_highlight}'

# Set pane border colors
set -g pane-border-style fg=white
set -g pane-active-border-style fg=white

# Set window status colors
setw -g window-status-style bg=default,fg=white
setw -g window-status-current-style bg=default,fg=white

# Set the display time to default colors
set -g message-style bg=default,fg=white

# Open new terminals in same folder
# Source: https://www.reddit.com/r/neovim/comments/sd5hqd/how_do_you_guys_work_with_terminals/hucpcqo/
unbind-key s
bind-key s split-window -h -c "#{pane_current_path}"
unbind-key v
bind-key v split-window -v -c "#{pane_current_path}"
unbind-key c
bind-key c new-window -c "#{pane_current_path}"

# Allow scrolling history without entering copy mode manually
set -g mouse on
setw -g mouse on
# Alternative to tmux-better-mouse-mode plugin
# bind -n WheelUpPane {
#     if -F '#{==:#{window_name},nvim}' {
#         send-keys -M
#     } {
#         copy-mode -e
#     }
# }
# bind -n PgUp {
#     if -F '#{==:#{window_name},nvim}' {
#         send-keys -M
#     } {
#         copy-mode -e
#     }
# }

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'