
# 1-based index for windows
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 10000

set-option -g default-terminal "screen-256color"

set-option -g status-bg black
set-option -g status-fg white
# set -g status-bg default
# set -g status-fg white

set -g status-interval 1
set -g status-right-length 100
set -g status-right '#(cat ~/.tmux-status)#{prefix_highlight}'

# Automatic window renaming
set -g automatic-rename on
# set -g automatic-rename-format '#{b:pane_current_path}'
set-option -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

# Set pane border colors
set -g pane-border-style fg=white
set -g pane-active-border-style fg=white

# Set window status colors
setw -g window-status-style bg=default,fg=white
setw -g window-status-current-style bg=default,fg=white

# Set the display time to default colors
set -g message-style bg=default,fg=white

# Open new terminals in same folder
# Source: https://www.reddit.com/r/neovim/comments/sd5hqd/how_do_you_guys_work_with_terminals/hucpcqo/
unbind-key s
bind-key s split-window -h -c "#{pane_current_path}"
unbind-key v
bind-key v split-window -v -c "#{pane_current_path}"
unbind-key c
bind-key c new-window -c "#{pane_current_path}"

# Allow scrolling history without entering copy mode manually
set -g mouse on
setw -g mouse on
# set -g mode-keys vi

# Disable copy on select.
# Source: https://github.com/tmux/tmux/issues/140#issuecomment-474341833
# You can still select and copy with Ctrl+C with Shift+Click-dragging
unbind-key -T copy-mode MouseDragEnd1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode MouseDown1Pane select-pane\; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection
bind-key -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= \"#{pane_in_mode}\" \"copy-mode -eM\" \"send-keys -M\"' 'copy-mode -eM'
# Alternative which still copies on select but doesn't exit copy mode.
# Source: https://www.reddit.com/r/tmux/comments/v73005/how_to_prevent_tmux_from_exiting_copy_mode_after/ibj8q9x/
# bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection -x
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

